services:
  minio:
    image: pgsty/silo:latest   # форк MinIO: официальный образ minio/minio удалён из реестров
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Консоль (веб-интерфейс)
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:15
    container_name: lakehouse-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lakekeeper
    volumes:
      - pg_data:/var/lib/postgresql/data

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    container_name: lakehouse-lakekeeper
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@postgres:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@postgres:5432/lakekeeper"
      RUST_LOG: info
    command: ["serve"]
    ports:
      - "8181:8181"
    depends_on:
      - postgres
      - minio

  trino:
    image: trinodb/trino:latest
    container_name: lakehouse-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - lakekeeper

  superset:
    image: apache/superset:latest
    container_name: lakehouse-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "your-secret-key-change-me"
    depends_on:
      - trino

volumes:
  minio_data:
  pg_data: